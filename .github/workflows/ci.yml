name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  linux:
    name: Linux (swift:6.4)
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - run: swift test -j 2

  macos:
    name: macOS (latest Xcode)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift test

  windows:
    name: Windows (Swift 6.3.2)
    runs-on: windows-2025
    steps:
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3.2-release
          swift-build: 6.3.2-RELEASE
      - uses: actions/checkout@v4
      - run: swift test

  manifest:
    name: Resolves with Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      matrix:
        swift: ["5.9", "5.10", "6.0"]
    steps:
      - uses: actions/checkout@v4
      - run: swift package describe
