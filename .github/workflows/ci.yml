name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  linux:
    name: Linux (swift:6.4)
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - run: swift test -j 2

  macos:
    name: macOS (latest Xcode)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift test
